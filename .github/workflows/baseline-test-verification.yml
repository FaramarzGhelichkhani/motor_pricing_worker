name: Baseline test verification

on:
  push:
    branches:
      - perf/stage1-baseline-verification

jobs:
  baseline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run existing test suite on unchanged baseline
        run: python -m unittest discover -s tests -v

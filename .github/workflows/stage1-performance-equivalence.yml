name: Stage 1 performance equivalence

on:
  push:
    branches:
      - perf/stage1-equivalent-optimizations
  pull_request:
    branches:
      - fix/publication-policy
  workflow_dispatch:

jobs:
  synthetic-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and synthetic equivalence tests
        run: python -m unittest discover -s tests -v

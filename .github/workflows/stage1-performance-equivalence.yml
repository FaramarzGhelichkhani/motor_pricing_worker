name: Stage 1 performance equivalence

on:
  push:
    branches:
      - perf/stage1-equivalent-optimizations
      - fix/age-plateau-2pct-failsafe
  pull_request:
    branches:
      - perf/stage1-equivalent-optimizations
  workflow_dispatch:

jobs:
  synthetic-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and synthetic equivalence tests
        run: python -m unittest tests.test_stage1_performance_equivalence tests.test_database_persistence tests.test_publication_policy -v

name: Causal publication policy regression

on:
  pull_request:
    paths:
      - "motorcycle_surface/**"
      - "tests/test_hierarchical_risk_guard.py"
      - "tests/test_causal_release_policy.py"
      - "tests/test_model_index_history_key_dtypes.py"
      - "tests/test_conservative_variant_age_guard.py"
      - ".github/workflows/causal-publication-tests.yml"
  workflow_dispatch:

jobs:
  causal-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Verify causal publication contracts
        run: |
          python -m compileall -q motorcycle_surface tasks/estimator_v2.py main.py
          pytest -q tests/test_hierarchical_risk_guard.py tests/test_causal_release_policy.py tests/test_model_index_history_key_dtypes.py tests/test_conservative_variant_age_guard.py
